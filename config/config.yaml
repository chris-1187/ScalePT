project:
  name: "ScalePT"
  user: "cmunz"
  key_filename: "" # /Users/<username>/.ssh/<key_name>

## Run configuration and hyperparameters
args:
  nnodes_used: 3
  nproc_per_node: 1
  dataset: "kitti"

## Infrastructure
# Primary worker node (Host 1), owns the NFS
primary_node:
  name: "host1"
  ip: "141.23.40.76"
  nfs_root: "/mnt/nfs_share"

# Worker nodes
worker_nodes:
  - name: "host1"
    ip: "141.23.40.76"
    training_cap: 10240 # points
  - name: "host2"
    ip: "141.23.40.77"
    training_cap: 10240
  - name: "host3"
    ip: "141.23.40.78"
    training_cap: 10240

paths:
  local_worker_repo: "./spt-worker"       # Local worker repo path
  remote_worker_repo: "~/spt-worker"      # Destination on worker nodes
  local_dataset: "./data/kitti/dataset"   # Local path to data
  remote_dataset: "/mnt/nfs_share/kitti/dataset"
  remote_experiments: "/mnt/nfs_share/experiments"
  local_experiments: "./experiments"